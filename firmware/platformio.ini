[platformio]
default_envs = button-node, pi-gateway

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CUE_LED_PIN=21

[env:button-node]
build_src_filter = -<*> +<button_node.cpp>

[env:pi-gateway]
build_src_filter = -<*> +<pi_gateway.cpp>

[env:range-sender]
build_src_filter = -<*> +<espnow_range_sender.cpp>

[env:range-receiver]
build_src_filter = -<*> +<espnow_range_receiver.cpp>

[env:reliable-button-test]
build_src_filter = -<*> +<reliable_button_test.cpp>
