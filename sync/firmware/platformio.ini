[platformio]
default_envs = sync-gateway

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../firmware/lib
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:sync-gateway]
build_src_filter = -<*> +<gateway.cpp>

[env:sync-remote]
build_src_filter = -<*> +<remote.cpp>
build_flags =
  ${env.build_flags}
  -D CUE_COORDINATOR_NODE=0x9070690BD848ULL
  -D REMOTE_START_PIN=0
  -D REMOTE_STOP_PIN=1

[env:sync-dc]
build_src_filter = -<*> +<dc_motor.cpp>
build_flags =
  ${env.build_flags}
  -D DC_RPWM_PIN=4
  -D DC_LPWM_PIN=5

[env:sync-dc-expansion]
build_src_filter = -<*> +<dc_motor.cpp>
build_flags =
  ${env.build_flags}
  -D DC_REN_PIN=D10
  -D DC_LEN_PIN=D9
  -D DC_RPWM_PIN=D8
  -D DC_LPWM_PIN=D7

[env:sync-stepper]
build_src_filter = -<*> +<stepper.cpp>
build_flags =
  ${env.build_flags}
  -D TMC_STEP_PIN=D9
  -D TMC_DIR_PIN=D10

[mqtt]
lib_deps =
  arduino-libraries/ArduinoMqttClient@^0.1.8

[env:sync-remote-mqtt]
build_src_filter = -<*> +<remote.cpp>
lib_deps = ${mqtt.lib_deps}
build_flags =
  ${env.build_flags}
  -D CUE_USE_MQTT=1
  -D CUE_COORDINATOR_NODE=0x020000000001ULL
  -D REMOTE_START_PIN=0
  -D REMOTE_STOP_PIN=1

[env:sync-horn-mqtt]
build_src_filter = -<*> +<horn.cpp>
lib_deps = ${mqtt.lib_deps}
build_flags =
  ${env.build_flags}
  -D CUE_USE_MQTT=1
  -D CUE_COORDINATOR_NODE=0x020000000001ULL
  -D HORN_SWITCH_PIN=D10
  -D HORN_SWITCH_ACTIVE_LEVEL=LOW
  -D HORN_SWITCH_INPUT_MODE=INPUT_PULLUP

[env:sync-dc-mqtt]
build_src_filter = -<*> +<dc_motor.cpp>
lib_deps = ${mqtt.lib_deps}
build_flags =
  ${env.build_flags}
  -D CUE_USE_MQTT=1
  -D DC_REN_PIN=D9
  -D DC_LEN_PIN=D9
  -D DC_RPWM_PIN=D7
  -D DC_LPWM_PIN=D8
  -D DC_LIMIT_FWD_PIN=D6
  -D DC_LIMIT_REV_PIN=D5
  -D DC_LIMIT_ACTIVE_LEVEL=HIGH
  -D DC_LIMIT_INPUT_MODE=INPUT

[env:sync-dc-expansion-mqtt]
build_src_filter = -<*> +<dc_motor.cpp>
lib_deps = ${mqtt.lib_deps}
build_flags =
  ${env.build_flags}
  -D CUE_USE_MQTT=1
  -D DC_REN_PIN=D9
  -D DC_LEN_PIN=D9
  -D DC_RPWM_PIN=D7
  -D DC_LPWM_PIN=D8
  -D DC_LIMIT_FWD_PIN=D6
  -D DC_LIMIT_REV_PIN=D5
  -D DC_LIMIT_ACTIVE_LEVEL=HIGH
  -D DC_LIMIT_INPUT_MODE=INPUT

[env:sync-stepper-mqtt]
build_src_filter = -<*> +<stepper.cpp>
lib_deps = ${mqtt.lib_deps}
build_flags =
  ${env.build_flags}
  -D CUE_USE_MQTT=1
  -D TMC_STEP_PIN=D9
  -D TMC_DIR_PIN=D10
  -D TMC_PULSE_HIGH_US=10
  -D TMC_DIR_SETUP_US=20

