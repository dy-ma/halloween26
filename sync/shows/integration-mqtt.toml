version = 2
name = "integration-mqtt"

[playback]
max_active = 8
dedupe_capacity = 512
# The horn uses a predecoded resident stream. PipeWire mixes normal song
# playback alongside it; the open stream also keeps the Bluetooth path awake.
resident_latency_ms = 20

[links.radio]
type = "mqtt-cue"
# The broker happens to run beside fx on the Pi today; this can be any host.
host = "mqtt.dylfi"
port = 1883
node = "020000000001"
client_id = "fx-show"
topic_prefix = "halloween"
# For an authenticated broker, set both fields and export the password before
# starting fx. Keep the secret itself out of this file.
# username = "fx"
# password_env = "HALLOWEEN_MQTT_PASSWORD"

[sources.remote]
type = "cue-link"
link = "radio"

[assets.tractor_tip]
type = "audio"
file = "/home/dyma/audio/tractor_tipping_trimmed.wav"

[assets.tractor_tip_no_horn]
type = "audio"
file = "/home/dyma/audio/tractor_tipping_no_horn.wav"

[assets.horn]
type = "audio"
file = "/home/dyma/audio/horn.wav"

[sinks.eye]
type = "screen"
screen_id = "tractor-eye"
initial_state = { mode = "sleeping", gaze = { x = 0.0, y = 0.0 } }

[sinks.speaker]
type = "audio"
device = "jbl"
volume = 0.70

# Replace these targets with the 12-digit node IDs printed by each board.
# Lift B belongs to the separate Tractor B attraction and is intentionally
# excluded from this Tractor A manifest.
[sinks.dc_a]
type = "cue"
link = "radio"
target = "1CDBD45CFDF0"

[sinks.stepper]
type = "cue"
link = "radio"
target = "9070690BE79C"

[props.lift_a]
label = "Lift A"
initial = "unknown"
ready = "low"
states = ["unknown", "homing-down", "low", "raising", "high", "halted", "fault"]

[props.lift_a.transitions.home]
from = ["unknown", "low", "high", "halted", "fault"]
active = "homing-down"
to = "low"
failure = "fault"

[props.lift_a.transitions.raise]
from = ["low"]
active = "raising"
to = "high"
failure = "fault"

[props.smokestack]
label = "Smokestack"
initial = "idle"
ready = "idle"
states = ["idle", "stroking", "halted", "fault"]

[props.smokestack.transitions.stroke]
from = ["idle"]
active = "stroking"
to = "idle"
failure = "fault"

[server]
bind = "0.0.0.0:8080"
static_dir = "../../tractor-eye/dist"
screen_id = "tractor-eye"

[kiosk]
enabled = true
url = "http://127.0.0.1:8080/?screen=tractor-eye&name=Pi-eye&client=pi-eye"

[flows.integration]
trigger = { source = "remote", cue = "horn:show", aliases = ["show:start"] }
role = "show"

[[flows.integration.nodes]]
id = "tractor-audio"
action = { type = "audio.play", sink = "speaker", asset = "tractor_tip_no_horn" }

[[flows.integration.nodes]]
id = "wake-eye"
at_ms = 250
action = { type = "screen.command", sink = "eye", command = { type = "eye/wake" }, final_state = { mode = "alert", gaze = { x = -0.2, y = -0.5 } } }

[[flows.integration.nodes]]
id = "dc-a-pulse"
at_ms = 4000
transition = "lift_a.raise"
# The upper limit defines the displayed high position. Reaching it is the
# successful end of this transition; timing out first means the lift failed to
# reach its calibrated position.
action = { type = "cue.emit", sink = "dc_a", cue = "dc:c:f:153:51:300:700:3500", wait_for = "dc:limit:fwd", timeout_ms = 6000 }

[[flows.integration.nodes]]
id = "stepper-turn"
at_ms = 9000
# Hardware-timed S-curve: 80 RPM peak, acceleration/deceleration from/to rest.
transition = "smokestack.stroke"
action = { type = "cue.emit", sink = "stepper", cue = "step:rev:1600:80", wait_for = "step:complete", timeout_ms = 4000 }

# The physical interaction takes two independent paths. This utility flow is
# dispatched before the state-gated show flow, so the horn sounds even when
# the controller rejects the choreography because it is not Ready.
[flows.horn_audio]
trigger = { source = "remote", cue = "horn:pushed" }

[[flows.horn_audio.nodes]]
id = "play-horn"
action = { type = "audio.hold.start", key = "horn", sink = "speaker", asset = "horn", loop_start_ms = 484, loop_end_ms = 710, lease_ms = 1200 }

# The horn board sends these while its switch remains down. Starting a named
# hold is idempotent, so this only renews the safety lease—it cannot layer more
# copies. The separate one-shot horn:show event requests the show after the
# deliberate-hold threshold.
[flows.horn_held]
trigger = { source = "remote", cue = "horn:held" }

[[flows.horn_held.nodes]]
id = "renew-horn"
action = { type = "audio.hold.start", key = "horn", sink = "speaker", asset = "horn", loop_start_ms = 484, loop_end_ms = 710, lease_ms = 1200 }

[flows.horn_released]
trigger = { source = "remote", cue = "horn:released" }

[[flows.horn_released.nodes]]
id = "stop-horn"
action = { type = "audio.hold.stop", key = "horn" }

[flows.reset]
trigger = { source = "remote", cue = "show:reset" }
role = "reset"

# Tractor A's lift lowers in reverse and ends locally at its lower limit switch.
[[flows.reset.nodes]]
id = "home-lift-a"
transition = "lift_a.home"
action = { type = "cue.emit", sink = "dc_a", cue = "dc:rev:90:20000", wait_for = "dc:limit:rev", timeout_ms = 22000 }

[[flows.reset.nodes]]
id = "reset-eye"
action = { type = "screen.command", sink = "eye", command = { type = "system/reset" }, final_state = { mode = "sleeping", gaze = { x = 0.0, y = 0.0 } } }

[flows.bench_audio]
trigger = { source = "remote", cue = "bench:audio" }

[[flows.bench_audio.nodes]]
id = "play-full-audio"
action = { type = "audio.play", sink = "speaker", asset = "tractor_tip" }

[flows.bench_eye_wake]
trigger = { source = "remote", cue = "bench:eye-wake" }

[[flows.bench_eye_wake.nodes]]
id = "wake-eye"
action = { type = "screen.command", sink = "eye", command = { type = "eye/wake" }, final_state = { mode = "tipping", gaze = { x = -0.25, y = -0.65 } } }

[flows.bench_eye_reset]
trigger = { source = "remote", cue = "bench:eye-reset" }

[[flows.bench_eye_reset.nodes]]
id = "reset-eye"
action = { type = "screen.command", sink = "eye", command = { type = "system/reset" }, final_state = { mode = "sleeping", gaze = { x = 0.0, y = 0.0 } } }

[flows.stop_all]
trigger = { source = "remote", cue = "show:stop" }
role = "stop"

[[flows.stop_all.nodes]]
id = "stop-dc-a"
action = { type = "cue.emit", sink = "dc_a", cue = "dc:stop" }

[[flows.stop_all.nodes]]
id = "stop-stepper"
action = { type = "cue.emit", sink = "stepper", cue = "step:stop" }

[[flows.stop_all.nodes]]
id = "reset-eye"
action = { type = "screen.command", sink = "eye", command = { type = "system/reset" }, final_state = { mode = "sleeping", gaze = { x = 0.0, y = 0.0 } } }

[controls.run_integration]
type = "flow"
label = "Run integration sequence"
flow = "integration"

[controls.stop_all]
type = "flow"
label = "STOP ALL"
flow = "stop_all"

[controls.reset_show]
type = "flow"
label = "Reset eye and home Lift A"
flow = "reset"
panel = "show"
section = "show"

[controls.audio_test]
type = "flow"
label = "Play full audio"
flow = "bench_audio"
key = "a"
panel = "speaker"
section = "bench"

[controls.eye_wake_test]
type = "flow"
label = "Wake eye"
flow = "bench_eye_wake"
key = "e"
panel = "tractor-eye"
section = "bench"

[controls.eye_reset]
type = "flow"
label = "Reset eye"
flow = "bench_eye_reset"
panel = "tractor-eye"
section = "bench"

[controls.dc_a_forward]
type = "cue"
label = "Lift A up"
sink = "dc_a"
panel = "lift_a"
cue = "dc:jog:fwd:255"
release_cue = "dc:stop"
repeat_ms = 100
expires_after_ms = 500
key = "w"

[controls.dc_a_reverse]
type = "cue"
label = "Lift A down"
sink = "dc_a"
panel = "lift_a"
cue = "dc:jog:rev:255"
release_cue = "dc:stop"
repeat_ms = 100
expires_after_ms = 500
key = "s"

[controls.stepper_stroke]
type = "cue"
label = "Smokestack stroke (360°)"
sink = "stepper"
panel = "smokestack"
cue = "step:rev:1600:60"
key = "Space"

[controls.stepper_position_cw]
type = "cue"
label = "Position smokestack clockwise"
sink = "stepper"
panel = "smokestack"
cue = "step:jog:fwd:30"
release_cue = "step:stop"
repeat_ms = 100
expires_after_ms = 500

[controls.stepper_position_ccw]
type = "cue"
label = "Position smokestack counter-clockwise"
sink = "stepper"
panel = "smokestack"
cue = "step:jog:rev:30"
release_cue = "step:stop"
repeat_ms = 100
expires_after_ms = 500

[controls.stepper_stop]
type = "cue"
label = "Stop smokestack"
sink = "stepper"
panel = "smokestack"
cue = "step:stop"


